name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build release archive and notes
        shell: bash
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME#v}"
          archive="mac-ac-disablesleep-${version}.zip"

          git archive \
            --format=zip \
            --prefix="mac-ac-disablesleep-${version}/" \
            --output="${archive}" \
            HEAD \
            README.md \
            README.zh-CN.md \
            LICENSE \
            CHANGELOG.md \
            VERSION \
            launchd \
            scripts \
            src
          shasum -a 256 "${archive}" > "${archive}.sha256"

          {
            printf '## Changes\n\n'
            awk -v version="${version}" '
              index($0, "## [" version "] - ") == 1 { capture = 1; next }
              capture && /^## \[/ { exit }
              capture { print }
            ' CHANGELOG.md
            printf '\n## Download verification\n\n'
            printf '```text\n'
            cut -d " " -f 1 "${archive}.sha256"
            printf '```\n'
          } > release-notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME#v}"
          archive="mac-ac-disablesleep-${version}.zip"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" \
              "${archive}" \
              "${archive}.sha256" \
              --clobber
            gh release edit "${GITHUB_REF_NAME}" \
              --title "mac-ac-disablesleep ${GITHUB_REF_NAME}" \
              --notes-file release-notes.md
          else
            gh release create "${GITHUB_REF_NAME}" \
              "${archive}" \
              "${archive}.sha256" \
              --title "mac-ac-disablesleep ${GITHUB_REF_NAME}" \
              --notes-file release-notes.md \
              --verify-tag
          fi
